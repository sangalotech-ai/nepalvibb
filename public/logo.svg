    <circle cx="26" cy="24" r="14" fill="#F97316" opacity="0.9" />
    
    <!-- Mountain Background Layer -->
    <path d="M12 44 L28 14 L44 44 Z" fill="#0D5C46" />
    <path d="M28 14 L33 24 L28 26 L23 24 Z" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Mountain Foreground Layer -->
    <path d="M22 44 L38 20 L54 44 Z" fill="#064E3B" />
    <path d="M38 20 L42 27 L38 29 L34 27 Z" fill="#FFFFFF" opacity="0.95" />
    
